<!DOCTYPE html>
<!-- Oude links van de snelstudie (mapv.html, mapv.html?par=N) → kaart.html; zonder par de nabijheidsklasse -->
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Kaart Zuid-Holland</title>
  <script>
    const p = new URLSearchParams(location.search);
    if (!p.has('par') && !p.has('vak')) p.set('vak', 'stedelijkheid');
    location.replace('kaart.html?' + p + location.hash);
  </script>
</head>
<body>
  <p><a href="kaart.html?vak=stedelijkheid">Naar de kaart</a></p>
</body>
</html>
