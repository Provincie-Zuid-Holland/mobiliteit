<!DOCTYPE html>
<html lang="nl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda</title>
<style>
@font-face{font-family:"Karbon";font-style:normal;font-weight:400;font-display:swap;
  src:url("fonts/Karbon-Regular.woff2") format("woff2"),
      url("fonts/karbon-regular-webfont.woff") format("woff")}
@font-face{font-family:"Karbon";font-style:normal;font-weight:500;font-display:swap;
  src:url("fonts/Karbon-Medium.woff2") format("woff2"),
      url("fonts/karbon-medium-webfont.woff") format("woff")}

html,body{margin:0;padding:0;width:100%;height:100%;background-color:transparent;
  font-family:"Karbon",Arial,Helvetica,sans-serif}
body{overflow:hidden}

.agenda{--maat:24px;--verstreken:#b4b4b4;--komt:#16113b;--nu:#281f6b;--let:#ff6b02;
  font-size:var(--maat);line-height:1.35;color:var(--komt)}
.agenda h2{font-weight:500;font-size:calc(var(--maat)*1.55);line-height:1.15;color:var(--nu);
  margin:0 0 calc(var(--maat)*0.7);padding-bottom:calc(var(--maat)*0.45);
  border-bottom:2px solid var(--nu)}

.agenda ol{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:auto 1fr auto;gap:0 calc(var(--maat)*0.9);
  align-items:baseline;padding:calc(var(--maat)*0.28) 0;
  transition:color .4s ease,opacity .4s ease}
.agenda .tijd{font-variant-numeric:tabular-nums;white-space:nowrap}
.agenda .wat{min-width:0}
.agenda .rest{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;
  color:var(--let);text-align:right}

/* actuele tijd, rechtsonder */
.nutijd{position:fixed;right:0;bottom:0;font-variant-numeric:tabular-nums;
  font-weight:500;font-size:calc(var(--maat)*1.15);line-height:1;color:var(--nu);
  padding:calc(var(--maat)*0.15) 0 0 calc(var(--maat)*0.6)}

/* verstreken */
.agenda li.af{color:var(--verstreken)}
/* nu bezig */
.agenda li.bezig{color:var(--nu);font-weight:500}
/* bijna om, of al uitgelopen */
.agenda li.let{color:var(--let);font-weight:500}
.agenda li.uit .rest{color:var(--let)}
</style>
</head>
<body>
<div class="agenda" id="agenda"><ol id="lijst"></ol>
<div class="nutijd" id="nutijd"></div></div>

<script>
/* ------------------------------------------------------------------
   agenda.html — agenda die meeloopt met de klok.
   Zusje van klok.html; zelfde parameters waar het kan.

   Parameters (querystring):
     a=<agenda>          de agenda in de URL zelf, kortste vorm:
                         a=15:35 Hoofdpunten;15:45 Programma;17:30 Einde
                         items gescheiden door ';', tijd en tekst door een spatie.
                         Staat er een ';' of '&' in je tekst, gebruik dan %3B of %26.
     json=<json>         hetzelfde maar als JSON (url-encoded)
     src=agenda.json     JSON uit een bestand (relatief pad of volledige URL)
     titel=Agenda        kop boven de lijst; leeg = geen kop
     eind=17:30          eindtijd van het laatste item, als dat er zelf geen heeft
     warn=5              vanaf hoeveel minuten resterend het item oranje wordt
     size=24             basisgrootte in px
     bg=white            achtergrondkleur (standaard doorzichtig)
     fg=#16113b          kleur van items die nog moeten komen
     tijd=nee            de actuele tijd rechtsonder weglaten (standaard staat hij er)
     nu=16:45            doe alsof het dit tijdstip is — om te controleren

   JSON mag drie vormen hebben:
     [["15:35","Hoofdpunten"],["15:45","Programma"]]
     [{"tijd":"15:35","wat":"Hoofdpunten"}, ...]
     {"titel":"Agenda","eind":"17:30","items":[ ... ]}
------------------------------------------------------------------ */

function param(naam){ return new URLSearchParams(window.location.search).get(naam); }

// "15:35" -> minuten sinds middernacht. Geeft null bij onzin.
function naarMinuten(tekst){
  if(typeof tekst!=="string") return null;
  var m=tekst.trim().match(/^(\d{1,2})[:.](\d{2})$/);
  if(!m) return null;
  var u=Number(m[1]), min=Number(m[2]);
  if(u>23||min>59) return null;
  return u*60+min;
}

// minuten sinds middernacht -> "16:45"
function alsTijd(minuten){
  var m=Math.floor(minuten)%1440; if(m<0) m+=1440;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}

// "15:35 Hoofdpunten;15:45 Programma" -> [{tijd,wat}, ...]
function leesKort(tekst){
  return String(tekst).split(";").map(function(deel){
    var m=deel.trim().match(/^(\d{1,2}[:.]\d{2})\s*(.*)$/);
    return m ? {tijd:m[1], wat:m[2]} : null;
  }).filter(Boolean);
}

// Elke toegestane JSON-vorm naar {titel, eind, items:[{tijd,wat,start}]}.
function leesAgenda(ruw){
  var titel=null, eind=null, lijst=ruw;
  if(ruw && !Array.isArray(ruw) && typeof ruw==="object"){
    titel = ruw.titel != null ? ruw.titel : null;
    eind  = ruw.eind  != null ? ruw.eind  : null;
    lijst = ruw.items || ruw.agenda || [];
  }
  if(!Array.isArray(lijst)) lijst=[];
  var items=[];
  lijst.forEach(function(rij){
    var tijd, wat;
    if(Array.isArray(rij)){ tijd=rij[0]; wat=rij[1]; }
    else if(rij && typeof rij==="object"){
      tijd = rij.tijd != null ? rij.tijd : rij.t;
      wat  = rij.wat  != null ? rij.wat  : (rij.omschrijving != null ? rij.omschrijving : rij.w);
    }
    var start=naarMinuten(tijd);
    if(start===null) return;                       // regel zonder geldige tijd: overslaan
    items.push({tijd:String(tijd).replace(".",":"), wat: wat==null?"":String(wat), start:start});
  });
  items.sort(function(a,b){ return a.start-b.start; });
  return {titel:titel, eind:eind, items:items};
}

/* Tekent de agenda in een container.
   agenda = resultaat van leesAgenda(), nuMin = minuten sinds middernacht,
   opties = {warn, eind, titel} */
function toonAgenda(container, agenda, nuMin, opties){
  opties = opties || {};
  var warn = opties.warn != null ? opties.warn : 5;
  var items = agenda.items;
  var lijst = container.querySelector("ol") || container;
  var titelTekst = opties.titel != null ? opties.titel
                 : (agenda.titel != null ? agenda.titel : null);

  // kop
  var oudeKop = container.querySelector("h2");
  if(titelTekst){
    if(!oudeKop){
      oudeKop=document.createElement("h2");
      container.insertBefore(oudeKop, lijst);
    }
    if(oudeKop.textContent!==titelTekst) oudeKop.textContent=titelTekst;
  } else if(oudeKop){ oudeKop.remove(); }

  // einde van het laatste item: expliciete eindtijd, anders heeft het geen duur
  var slot = naarMinuten(opties.eind != null ? opties.eind : agenda.eind);

  lijst.innerHTML="";
  items.forEach(function(item, i){
    var volgende = items[i+1];
    var eindeItem = volgende ? volgende.start : slot;   // null = eindmarkering
    var li=document.createElement("li");

    var status;                     // "af" | "bezig" | "komt"
    if(eindeItem===null){
      status = nuMin >= item.start ? "af" : "komt";     // laatste regel, bijv. "Einde"
    } else if(nuMin >= eindeItem){
      status = "af";
    } else if(nuMin >= item.start){
      status = "bezig";
    } else {
      status = "komt";
    }

    var resterend = null;
    if(status==="bezig" && eindeItem!==null){
      resterend = Math.ceil(eindeItem - nuMin);         // hele minuten, als in klok.html
      if(resterend <= warn) li.classList.add("let");
    }
    if(status==="af") li.classList.add("af");
    if(status==="bezig") li.classList.add("bezig");

    var t=document.createElement("span"); t.className="tijd"; t.textContent=item.tijd;
    var w=document.createElement("span"); w.className="wat";  w.textContent=item.wat;
    var r=document.createElement("span"); r.className="rest";
    r.textContent = (resterend!==null && resterend<=warn) ? "("+resterend+")" : "";

    li.appendChild(t); li.appendChild(w); li.appendChild(r);
    lijst.appendChild(li);
  });
}

/* ---------------- alleen uitvoeren als losse pagina ---------------- */
if(typeof window!=="undefined" && !window.__agendaAlsModule){
  (function(){
    var doel=document.getElementById("agenda");
    var opties={
      warn: Number(param("warn")) || 5,
      eind: param("eind"),
      titel: param("titel")!==null ? param("titel") : undefined
    };

    var maat=Number(param("size"));
    if(maat) doel.style.setProperty("--maat", maat+"px");
    var bg=param("bg"); if(bg) document.body.style.backgroundColor=bg;
    var fg=param("fg");
    if(fg) doel.style.setProperty("--komt", /^[0-9a-fA-F]{3,8}$/.test(fg) ? "#"+fg : fg);

    var klokje=document.getElementById("nutijd");
    if(param("tijd")==="nee" || param("tijd")==="geen"){ klokje.remove(); klokje=null; }

    var agenda={titel:null,eind:null,items:[]};

    function tik(){
      var nuMin;
      var vast=naarMinuten(param("nu"));
      if(vast!==null){ nuMin=vast; }
      else { var d=new Date(); nuMin = d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
      toonAgenda(doel, agenda, nuMin, opties);
      if(klokje) klokje.textContent = alsTijd(nuMin);
    }

    function start(ruw){
      agenda=leesAgenda(ruw);
      if(!agenda.items.length){
        doel.querySelector("ol").innerHTML=
          '<li style="color:#d11f3d">Geen agenda-items gevonden — controleer src= of json=</li>';
        return;
      }
      tik();
      setInterval(tik, 1000);
    }

    var kort=param("a");
    var inline=param("json");
    var bron=param("src");
    if(kort){
      start(leesKort(kort));
    } else if(inline){
      try { start(JSON.parse(inline)); }
      catch(e){ doel.querySelector("ol").innerHTML=
        '<li style="color:#d11f3d">json= is geen geldige JSON</li>'; }
    } else if(bron){
      fetch(bron, {cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(start)
        .catch(function(e){ doel.querySelector("ol").innerHTML=
          '<li style="color:#d11f3d">Kon '+bron+' niet laden ('+e.message+')</li>'; });
    } else {
      doel.querySelector("ol").innerHTML=
        '<li style="color:#5c5c5c">Geef een agenda mee met <code>?a=</code>, <code>?json=</code> of <code>?src=</code></li>';
    }
  })();
}
</script>
</body>
</html>
